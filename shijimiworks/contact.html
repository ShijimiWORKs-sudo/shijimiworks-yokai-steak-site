<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お問い合わせ | ShijimiWORKS</title><link rel="stylesheet" href="../assets/css/style.css"></head>
<body class="works-page contact-page">
  <header class="sw-header"><a class="sw-brand" href="../index.html"><img class="contact-logo" src="../assets/images/icon_shijimiworks.jpeg" alt="ShijimiWORKS ロゴ"><span>ShijimiWORKS<small>AI × Article × Design</small></span></a><a class="text-link" href="../index.html">← HOMEへ戻る</a></header>
  <main class="contact-main">
    <div class="contact-copy" data-reveal><p class="eyebrow">CONTACT</p><h1>まだ形になっていない<br>相談でも、どうぞ。</h1><p>記事制作、構成、デザイン、AI活用について。目的や困りごとをお聞きし、いっしょに整理します。</p><div class="contact-note"><b>ご相談時にわかる範囲で</b><span>目的 / 希望時期 / ご予算感 / 参考資料</span></div></div>
    <!-- TODO: 正式な問い合わせ先メールアドレス確定後、mailtoの宛先を設定する -->
    <form class="contact-form" data-contact-form data-reveal><label>お名前<input name="name" required autocomplete="name"></label><label>メールアドレス<input name="email" type="email" required autocomplete="email"></label><label>ご相談内容<select name="subject"><option>記事・コンテンツ制作</option><option>デザイン制作</option><option>AI活用・業務効率化</option><option>その他</option></select></label><label>メッセージ<textarea name="message" rows="7" required></textarea></label><button class="button button--black" type="submit">メールを作成する ↗</button><p class="form-note" data-form-note>メールアプリで本文を作成します。正式な連絡先を宛先へご入力ください。</p></form>
  </main>
  <script src="../assets/js/main.js"></script>
</body>
</html>
